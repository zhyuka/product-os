name: live evals

# Runs the eval suite in evals/ through `claude plugin eval`: real Claude Code
# sessions with the plugin loaded, and the same cases again without it as the
# baseline. Every run is a paid model call, so the workflow runs only when a
# release tag vX.Y.Z is pushed, on three runners, each capped at $3.
#
# It signs in through Anthropic workload identity federation: the job asks GitHub
# for an OIDC token and Claude Code exchanges it, so no API key is stored. The
# repository variables ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
# ANTHROPIC_SERVICE_ACCOUNT_ID and ANTHROPIC_WORKSPACE_ID name the rule; with any
# of them unset, the evals are skipped with a notice. Nothing here uses an API
# key, which would win over federation. There is no pull_request trigger, so a
# pull request, a fork's included, never gets an id token. docs/checks.md, "CI
# and what it costs", has the caps and the API-key fallback.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: live-evals
  cancel-in-progress: false

env:
  # "latest", "stable" or a version such as 2.1.288. plugin eval needs 2.1.269 or later.
  CLAUDE_CODE_VERSION: latest
  JUDGE_MODEL: claude-haiku-4-5

jobs:
  federation:
    name: Check for the federation variables
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          if [ -n "$RULE" ] && [ -n "$ORG" ] && [ -n "$ACCOUNT" ] && [ -n "$WORKSPACE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::A federation variable (ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID, ANTHROPIC_SERVICE_ACCOUNT_ID or ANTHROPIC_WORKSPACE_ID) is not set, so the live evals are skipped."
          fi

  evals:
    name: Live evals (${{ matrix.os }})
    needs: federation
    if: needs.federation.outputs.present == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tools: Bash Edit Write
            filter: ""
          - os: macos-latest
            tools: Bash Edit Write
            filter: ""
          # Native Windows has no Bash sandbox, and `claude plugin eval` refuses
          # every run that grants a shell there. Windows runs only the cases
          # tagged no-shell, with Edit and Write granted.
          - os: windows-latest
            tools: Edit Write
            filter: --tag no-shell
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The plugin's hooks run `python3`. Linux and macOS runners have one;
      # setup-python on Windows installs python.exe only, so add python3.exe.
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.12"
      - name: Make python3 resolve (Windows)
        if: runner.os == 'Windows'
        run: |
          dir="$(dirname "$(command -v python)")"
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"

      # The Bash sandbox on Linux needs bubblewrap and socat, and on Ubuntu
      # 24.04 an AppArmor profile that lets bwrap create user namespaces.
      - name: Set up the Bash sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' '' \
              'profile bwrap /usr/bin/bwrap flags=(unconfined) {' '  userns,' \
              '  include if exists <local/bwrap>' '}' | sudo tee /etc/apparmor.d/bwrap > /dev/null
            sudo systemctl reload apparmor
          fi

      - name: Install Claude Code (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Versions
        run: |
          claude --version
          python3 --version
          git --version

      - name: Validate the plugin and the marketplace
        run: |
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate .

      # GitHub's OIDC token, with Anthropic's audience, in the file Claude Code reads it from. It
      # prints the claims the federation rule matches, sub, ref and event_name, never the token,
      # so a rule that doesn't match the subject format shows here (docs/checks.md).
      - name: Fetch GitHub OIDC token
        run: |
          echo "ANTHROPIC_IDENTITY_TOKEN_FILE=$RUNNER_TEMP/gha-jwt" >> "$GITHUB_ENV"
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/gha-jwt"
          python3 - "$RUNNER_TEMP/gha-jwt" <<'EOF'
          import base64, json, sys
          token = open(sys.argv[1], encoding="utf-8").read().strip()
          if token in ("", "null"):
              sys.exit("No OIDC token: GitHub's response held no value.")
          try:
              body = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(body + "=" * (-len(body) % 4)))
              if not isinstance(claims, dict):
                  raise ValueError
          except (IndexError, ValueError):
              sys.exit("No OIDC token: GitHub's response is not a JWT.")
          for key in ("sub", "ref", "event_name"):
              print(f"{key}: {claims.get(key)}")
          EOF

      # --scaffold runs each case's scaffold.sh, which writes fixture files.
      # The builder cases' scaffolds also accept their QA command in the
      # runner's own ~/.claude/product-os-checks.json, as /product-os:setup-kit has the person do.
      # --trust-plugin answers the first-run trust prompt. The cost ceiling is
      # a list-price estimate checked before each run starts.
      # A GitHub token lasts about 5 minutes and is good for one exchange, so a loop
      # writes a fresh one every 2 minutes for as long as the evals run.
      - name: Run the live evals
        run: |
          fetch() {
            curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.next" \
              && mv -f "$ANTHROPIC_IDENTITY_TOKEN_FILE.next" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
          }
          ( while sleep 120; do fetch || echo "::warning::The OIDC token refresh failed; trying again in 2 minutes."; done ) &
          refresher=$!
          trap 'kill "$refresher" 2>/dev/null' EXIT
          mkdir -p evals/results
          claude plugin eval . ${{ matrix.filter }} \
            --trust-plugin \
            --scaffold \
            --no-publish \
            --max-cost-usd 3 \
            --threshold 0.8 \
            --judge-model "$JUDGE_MODEL" \
            --concurrency 3 \
            --json "evals/results/live-${{ runner.os }}.json" \
            --allow-tools ${{ matrix.tools }}

      - name: Summarize
        if: always()
        run: |
          result="evals/results/live-${{ runner.os }}.json"
          if [ -f "$result" ]; then
            python3 evals/summarize.py "$result" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No result file: the eval step did not write $result." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the JSON result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-evals-${{ runner.os }}
          path: evals/results/live-${{ runner.os }}.json
          if-no-files-found: warn
          retention-days: 30
