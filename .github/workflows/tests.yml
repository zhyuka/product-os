name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # setup-python has no Python 3.9 build for Ubuntu 26.04, which ubuntu-latest
    # moved to on 2026-10-19, so the Linux 3.9 job runs on ubuntu-24.04.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]
        exclude:
          - { os: ubuntu-latest, python-version: "3.9" }
        include:
          - { os: ubuntu-24.04, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # tests/test_launcher.py runs every hook command in hooks/hooks.json, fed
      # every fixture, from a plugin folder whose path has spaces, in each shell
      # Claude Code can use: sh, dash and bash on macOS and Linux, Git Bash on
      # Windows, and PowerShell (pwsh, and Windows PowerShell 5.1) for Windows
      # without Git Bash. REQUIRE_SHELLS makes a missing shell a failure.
      # run_tests.py runs the tests in one process per CPU, up to eight, and
      # prints the first failures as error annotations.
      - name: Unit tests, with every hook command run in every shell
        env:
          REQUIRE_SHELLS: ${{ runner.os == 'Windows' && 'git-bash,pwsh,powershell' || 'sh,dash,bash,pwsh' }}
        run: python .github/run_tests.py

      - name: Demo
        run: python -m product_os demo

      - name: Install and check the example runs
        run: |
          python -m pip install .
          # The gates' in-page scripts are files beside the code. Read them from the installed
          # copy, outside the checkout, so a release that leaves them out fails here.
          (cd "$RUNNER_TEMP" && python -c "from product_os import gates; assert len(gates.IMAGES) > 1000, gates.__file__")
          product-os check examples/runs/qa-builder
          product-os check examples/runs/reviewer-read-only
          if product-os check examples/runs/cheap-builder; then exit 1; fi
          if product-os check examples/runs/reviewer-wrote; then exit 1; fi

      # The example project's check, proven again from its cases, passes on its code and
      # fails once its planted bad case is copied over that code.
      - name: Check the example project
        run: |
          product-os check --prove --run-listed --project examples/project
          planted="$RUNNER_TEMP/planted project"
          cp -R examples/project "$planted"
          cp examples/project/checks/cases/no-print/bad/app.py "$planted/src/app.py"
          if product-os check --run-listed --project "$planted"; then exit 1; fi

      # The same hook command typed into a real bash and a real pwsh, from a path
      # with spaces, as a reader of this log would run it.
      - name: A reviewer's write is denied (bash)
        run: |
          root="$RUNNER_TEMP/plugin root with spaces"
          mkdir -p "$root" && cp -R hooks product_os tests "$root/"
          command=$(python -c 'import json; print(json.load(open("hooks/hooks.json"))["hooks"]["PreToolUse"][0]["hooks"][0]["command"])')
          root_slashes=$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).as_posix())' "$root")
          cd "$root"
          answer=$(CLAUDE_PLUGIN_ROOT="$root_slashes" sh -c "${command//\$\{CLAUDE_PLUGIN_ROOT\}/$root_slashes}" < tests/fixtures/hooks/deny-reviewer-write.json)
          echo "$answer"
          case $answer in *'"permissionDecision": "deny"'*) ;; *) exit 1 ;; esac

      - name: A reviewer's write is denied (pwsh, as on Windows without Git Bash)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pwsh plugin root with spaces'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item -Recurse hooks, product_os, tests -Destination $root
          $command = (Get-Content -Raw hooks/hooks.json | ConvertFrom-Json).hooks.PreToolUse[0].hooks[0].command
          $command = $command.Replace('${CLAUDE_PLUGIN_ROOT}', '${env:CLAUDE_PLUGIN_ROOT}')
          $env:CLAUDE_PLUGIN_ROOT = $root.Replace('\', '/')
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($command))
          Set-Location $root
          $answer = Get-Content -Raw tests/fixtures/hooks/deny-reviewer-write.json | pwsh -NoProfile -NonInteractive -EncodedCommand $encoded
          $answer
          if (-not ($answer -match '"permissionDecision": "deny"')) { exit 1 }

  validate:
    # Claude Code installs without signing in, and plugin validate reads local
    # files only. On Windows the checkout gets the line endings a Git for
    # Windows clone gets: with CRLF, v0.1.0's ado skill failed to parse there
    # and nowhere else.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code (Linux)
        if: runner.os != 'Windows'
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Claude Code (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((irm https://claude.ai/install.ps1))) latest
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The two commands live.yml runs before its evals.
      - name: Validate the plugin and the marketplace
        run: |
          claude --version
          claude plugin validate .claude-plugin/plugin.json
          claude plugin validate .

      - name: Validate the marketplace and the plugin, strictly
        if: runner.os != 'Windows'
        run: |
          claude plugin validate --strict .
          # Before Claude Code 2.1.289, validating the repo root checks only the
          # marketplace. A copy without marketplace.json checks the plugin's
          # manifest, hooks, skills and agents on any version, with the Agent
          # Plugins manifest beside them.
          plugin="$RUNNER_TEMP/plugin"
          mkdir -p "$plugin"
          cp -R .claude-plugin hooks skills agents plugin.json README.md "$plugin/"
          rm "$plugin/.claude-plugin/marketplace.json"
          claude plugin validate --strict "$plugin"
