schema_version: "1.1"
name: skill-build-change-missing-width
description: >-
  The build-change skill on a project that ships 1440 and 390 (app.widths), with a mockup for
  1440 only and nobody to answer. A width the design lacks makes the section not done, and the
  report names it first; a reviewer's MATCHES isn't sign-off.
expected_outcome: The report opens with the missing 390 design and says the section isn't done.
tags: [skill, build-change]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Grep, Glob, Bash, Edit, Write, Agent, Skill]
