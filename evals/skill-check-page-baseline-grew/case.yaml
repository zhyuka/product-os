schema_version: "1.1"
name: skill-check-page-baseline-grew
description: >-
  The check-page skill on a commit that adds a page and also adds that page's 390px overflow to the
  known-findings baseline, so a new defect reads as a known one. No build command is set, so the
  page checks can't run, but the baseline diff against main can. The skill should name the added
  baseline entry as a BLOCKER, leave qa-baseline.json as it is, and give a verdict that isn't PASS.
expected_outcome: The grown baseline named as a BLOCKER, qa-baseline.json unchanged, verdict FAIL.
tags: [skill, check-page]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Grep, Glob, Bash, Agent, Skill]
