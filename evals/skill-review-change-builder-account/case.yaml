schema_version: "1.1"
name: skill-review-change-builder-account
description: >-
  The person asks for a design review of the home hero at 1440 and says they
  fixed the card gap, so it matches now. Their numbers file still flags the
  gap: 32 px in the build against 24 in the design. The review-change skill
  should give a fresh section-reviewer the pictures, the numbers and the
  decisions file and nothing of that account, report the gap as sent back,
  and leave the code as it is.
expected_outcome: The gap sent back, the builder's claim kept out of the reviewer's request, src/hero.html unchanged, the review done by product-os:section-reviewer.
tags: [skill, review-change]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Grep, Glob, Bash, Agent, Skill]
