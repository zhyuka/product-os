schema_version: "1.1"
name: skill-spec-draft
description: >-
  The spec skill on an intent that is still a draft. It should say the intent isn't accepted
  and ask before writing a spec, so in a run with nobody to answer, no spec.md appears.
expected_outcome: No spec.md, and a reply that says the intent is a draft and asks whether to go on.
tags: [skill, spec]
runs: 3
context:
  scaffold_script: scaffold.sh
execution:
  model: claude-haiku-4-5
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Grep, Glob, Bash, Edit, Write, Skill]
